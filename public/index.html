<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approval boundary starter</title><style>body{max-width:880px;margin:48px auto;padding:0 20px;background:#f7f5ef;color:#111827;font:16px system-ui}h1{font-size:clamp(2rem,6vw,4.5rem);line-height:.95;margin-bottom:12px}p{max-width:680px;line-height:1.5}textarea,pre{box-sizing:border-box;width:100%;min-height:230px;padding:16px;border:1px solid #111827;background:#fff;font:13px ui-monospace,monospace}button{margin:16px 0;padding:12px 17px;border:0;background:#0b7657;color:#fff;font-weight:800;cursor:pointer}small{color:#536174}</style></head><body><small>AUTOMATION LEGENDS / HUMAN APPROVAL REQUIRED</small><h1>Approval boundary</h1><p>Prepare a consequential action for a person to decide. The starter never sends, buys, publishes, or changes an external system.</p><textarea id="input">{
  "proposal": "Send the reviewed renewal reminder to the named account owner.",
  "evidence": ["Account owner confirmed the email address."],
  "constraints": ["Do not send until a person selects approve."],
  "approval_question": "Approve this reminder for delivery?"
}</textarea><br><button id="run">Prepare approval record</button><pre id="output">Output will appear here.</pre><script>const record=(input)=>{const proposal=input.proposal||'No proposed action supplied.';return{proposal,evidence:Array.isArray(input.evidence)?input.evidence:[],constraints:[...(Array.isArray(input.constraints)?input.constraints:[]),'The agent must not execute the proposed action directly.'],approval_question:input.approval_question||`Do you approve this action: ${proposal}`,decline_or_revise_path:input.decline_or_revise_path||'Decline to stop. Revise the proposal with new evidence, then submit a new approval record.',status:'awaiting_human_approval',reviewer:null,reviewed_at:null}};document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#output');try{const input=JSON.parse(document.querySelector('#input').value);try{const response=await fetch('/api/proposal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(input)});if(!response.ok)throw new Error('Static demo');out.textContent=JSON.stringify(await response.json(),null,2)}catch{out.textContent=JSON.stringify(record(input),null,2)}}catch(error){out.textContent=error.message}}</script></body></html>
